<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grupo PinheiraMar — apartamentos mobiliados e completos para férias em família na Praia da Pinheira, SC." />
    <title>Grupo PinheiraMar · A sua casa de verão</title>

    <!-- Pré-visualização ao partilhar o link (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Grupo PinheiraMar" />
    <meta property="og:title" content="Grupo PinheiraMar · Apartamentos na Praia da Pinheira, SC" />
    <meta property="og:description" content="Apartamentos mobiliados e completos, à beira-mar, para férias em família. Veja a disponibilidade e reserve online." />
    <meta property="og:url" content="https://www.pinheiramar.com.br/" />
    <meta property="og:image" content="https://www.pinheiramar.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vista do mar e da praia a partir do residencial, na Praia da Pinheira" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" />

    <!-- PWA / "Instalar site" -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1B1C46" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PinheiraMar" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Montserrat', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; background: #fff; color: #1B1C46; }
      input, select, textarea, button { font-family: inherit; }

      /* Global form field style */
      .pmf { transition: border-color .18s; }
      .pmf:focus { border-color: #2D7F9D !important; box-shadow: 0 0 0 3px rgba(45,127,157,.16); }

      /* Animations */
      @keyframes pm-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes pm-pop  { from { opacity: 0; transform: scale(.93); } to { opacity: 1; transform: scale(1); } }
      .pm-fade { animation: pm-fade .3s ease both; }
      .pm-pop  { animation: pm-pop  .22s cubic-bezier(.34,1.56,.64,1) both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- O e-mail de confirmação sai só do servidor (server/email.js) — o
         script do EmailJS no navegador foi retirado. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
